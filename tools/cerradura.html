<!DOCTYPE html>
<!-- Plantilla de la página publicada (index.html). tools/build.js pone en #cifrado la app entera cifrada (AES-256-GCM,
     clave sacada de la contraseña con PBKDF2-SHA-256). Con la contraseña buena se descifra en el navegador y se pinta.
     Todo el código va en una función: la app descifrada se carga en esta misma ventana y no debe chocar con nada. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Japan2026</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#fbf6ec">
<script>
  try { const th = localStorage.getItem('viaje:tema'); if (th) document.documentElement.dataset.theme = th; } catch {}
  // Paleta de colores (la elige cada móvil; por defecto, Rojo Mugiwara).
  document.documentElement.dataset.paleta = 'mugiwara';
  try { const pa = localStorage.getItem('viaje:paleta'); if (pa) document.documentElement.dataset.paleta = pa; } catch {}
</script>
<style>
  :root { --bg: #f6f3ee; --panel: #fffdf9; --ink: #1f1c19; --mute: #71695f; --line: #e5ded3; --accent: #b3402a; --err: #b3352f; }
  :root[data-theme="dark"] { --bg: #141312; --panel: #1d1b19; --ink: #ece6dc; --mute: #a0978b; --line: #312d29; --accent: #f08a6c; --err: #ff8a7a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141312; --panel: #1d1b19; --ink: #ece6dc; --mute: #a0978b; --line: #312d29; --accent: #f08a6c; --err: #ff8a7a; }
  }
:root[data-paleta="mugiwara"] { --bg: #fbf6ec; --panel: #ffffff; --ink: #1c1917; --mute: #6f665c; --line: #ebe1cf; --accent: #d62828; }
  :root[data-paleta="mugiwara"][data-theme="dark"] { --bg: #15110f; --panel: #201a17; --ink: #f3ece2; --mute: #a89b8c; --line: #382d27; --accent: #ff5a4e; }
  @media (prefers-color-scheme: dark) { :root[data-paleta="mugiwara"]:not([data-theme="light"]) { --bg: #15110f; --panel: #201a17; --ink: #f3ece2; --mute: #a89b8c; --line: #382d27; --accent: #ff5a4e; } }
  :root[data-paleta="aizome"] { --bg: #f4f5f8; --panel: #ffffff; --ink: #161a24; --mute: #5f6677; --line: #dfe3ec; --accent: #2b4c9b; }
  :root[data-paleta="aizome"][data-theme="dark"] { --bg: #0f1219; --panel: #171c27; --ink: #e7eaf2; --mute: #9aa2b5; --line: #283043; --accent: #7ea2ff; }
  @media (prefers-color-scheme: dark) { :root[data-paleta="aizome"]:not([data-theme="light"]) { --bg: #0f1219; --panel: #171c27; --ink: #e7eaf2; --mute: #9aa2b5; --line: #283043; --accent: #7ea2ff; } }
  :root[data-paleta="sakura"] { --bg: #fbf5f6; --panel: #ffffff; --ink: #211a1d; --mute: #776a70; --line: #efdfe4; --accent: #c8457a; }
  :root[data-paleta="sakura"][data-theme="dark"] { --bg: #161114; --panel: #21191d; --ink: #f4e9ee; --mute: #a9969f; --line: #3a2a31; --accent: #ff86b5; }
  @media (prefers-color-scheme: dark) { :root[data-paleta="sakura"]:not([data-theme="light"]) { --bg: #161114; --panel: #21191d; --ink: #f4e9ee; --mute: #a9969f; --line: #3a2a31; --accent: #ff86b5; } }
  :root[data-paleta="matcha"] { --bg: #f5f6ef; --panel: #fdfdf8; --ink: #1b1e17; --mute: #666b5c; --line: #e1e4d4; --accent: #4a7a2c; }
  :root[data-paleta="matcha"][data-theme="dark"] { --bg: #11140f; --panel: #1a1e16; --ink: #e9eddf; --mute: #9aa18c; --line: #2c3324; --accent: #9bcf6a; }
  @media (prefers-color-scheme: dark) { :root[data-paleta="matcha"]:not([data-theme="light"]) { --bg: #11140f; --panel: #1a1e16; --ink: #e9eddf; --mute: #9aa18c; --line: #2c3324; --accent: #9bcf6a; } }
  :root[data-paleta="neon"] { --bg: #f5f3fa; --panel: #ffffff; --ink: #17141f; --mute: #655f75; --line: #e2ddef; --accent: #7b2ff7; }
  :root[data-paleta="neon"][data-theme="dark"] { --bg: #0b0a12; --panel: #15131f; --ink: #ece9f7; --mute: #9a95b0; --line: #29243b; --accent: #ff3d9a; }
  @media (prefers-color-scheme: dark) { :root[data-paleta="neon"]:not([data-theme="light"]) { --bg: #0b0a12; --panel: #15131f; --ink: #ece9f7; --mute: #9a95b0; --line: #29243b; --accent: #ff3d9a; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  form {
    width: 100%; max-width: 360px; padding: 28px 22px; border-radius: 18px; background: var(--panel);
    border: 1px solid var(--line); display: grid; gap: 14px; text-align: center;
  }
  .k { justify-self: center; width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
  h1 { margin: 0; font: 700 22px/1.2 Georgia, serif; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .campo { position: relative; }
  .campo input { padding-right: 50px; }
  .ojo {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%); display: grid; place-items: center;
    width: 40px; height: 40px; padding: 0; border: 0; border-radius: 9px; background: none; color: var(--mute);
  }
  .ojo:hover, .ojo[aria-pressed="true"] { color: var(--accent); }
  .ojo svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ojo .cerrado, .ojo[aria-pressed="true"] .abierto { display: none; }
  .ojo[aria-pressed="true"] .cerrado { display: inline; }
  button {
    padding: 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button[type="submit"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button:disabled { opacity: .6; cursor: default; }
  #recordar[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #recordar[aria-pressed="true"]::before { content: "✓ "; }
  .msg { min-height: 1.5em; margin: 0; font-size: 14px; color: var(--err); }
  .hint { margin: 0; font-size: 13px; color: var(--mute); }
</style>
</head>
<body>
<form id="cerradura" autocomplete="off">
  <img class="k" src="assets/logo.png" alt="">
  <h1>Japan2026</h1>
  <div class="campo">
    <input id="pass" type="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required>
    <button type="button" id="ver" class="ojo" aria-label="Mostrar la contraseña" aria-pressed="false" title="Mostrar la contraseña">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="abierto" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle class="abierto" cx="12" cy="12" r="3"/><path class="cerrado" d="M3 3l18 18M10.6 6.1A8.6 8.6 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3 3.7M6.6 6.7C3.9 8.5 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
    </button>
  </div>
  <button type="button" id="recordar" aria-pressed="false">Recordar en este dispositivo</button>
  <button type="submit" id="entrar">Entrar</button>
  <p class="msg" id="msg" role="alert"></p>
  <p class="hint">Recuérdala solo en tus dispositivos. El candado de arriba la olvida.</p>
</form>
<script id="cifrado" type="application/json">"__CIFRADO__"</script>
<script>
(() => {
  const CLAVE = 'viaje:clave';
  const datos = JSON.parse(document.getElementById('cifrado').textContent);
  const $ = id => document.getElementById(id);

  // Para que funcione sin conexión (sw.js guarda esta página). En local (127.0.0.1), para poder probarlo.
  const seguro = location.protocol === 'https:' || ['127.0.0.1', 'localhost'].includes(location.hostname);
  if ('serviceWorker' in navigator && seguro) navigator.serviceWorker.register('sw.js').catch(() => {});

  function bytes(base64) {
    const texto = atob(base64), out = new Uint8Array(texto.length);
    for (let i = 0; i < texto.length; i++) out[i] = texto.charCodeAt(i);
    return out;
  }
  const base64 = buffer => btoa(String.fromCharCode(...new Uint8Array(buffer)));

  async function derivar(pass, exportable) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(datos.sal), iterations: datos.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, exportable, ['encrypt', 'decrypt']);
  }

  async function descifrar(clave) {
    const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(datos.iv) }, clave, bytes(datos.datos));
    return new TextDecoder().decode(plano);
  }

  // Sustituye esta página por la app descifrada (en la misma ventana: el enlace con #/dia/... se mantiene).
  // Espera a que la página haya acabado de cargar: si no, document.open() no la vacía y document.write() añade la app
  // debajo de la cerradura.
  const cargada = () => (document.readyState === 'complete'
    ? Promise.resolve()
    : new Promise(resolve => addEventListener('load', resolve, { once: true })));

  // La clave se deja en window.CLAVE_VIAJE: la app la usa para cifrar lo que comparte (js/sincro.js).
  async function mostrar(html, clave) {
    // La app solo se puede escribir una vez por ventana (su código declara constantes globales). Si ya se escribió,
    // se recarga de cero; con «Recordar» se abrirá sola.
    await cargada();
    if (window.CERRADURA) {
      location.reload();
      return;
    }
    window.CERRADURA = true;
    window.CLAVE_VIAJE = clave;
    document.open();
    document.write(html);
    document.close();
  }

  async function conGuardada() {
    let guardada = null;
    try { guardada = localStorage.getItem(CLAVE); } catch {}
    if (!guardada) return false;
    try {
      const clave = await crypto.subtle.importKey('raw', bytes(guardada), 'AES-GCM', false, ['encrypt', 'decrypt']);
      const html = await descifrar(clave);
      await mostrar(html, clave);
      return true;
    } catch {
      // La contraseña ha cambiado: se vuelve a pedir.
      try { localStorage.removeItem(CLAVE); } catch {}
      return false;
    }
  }

  // Ojo: muestra u oculta lo que se está escribiendo (sin perder el cursor del campo).
  $('ver').onclick = () => {
    const ver = $('pass').type === 'password';
    $('pass').type = ver ? 'text' : 'password';
    $('ver').setAttribute('aria-pressed', ver);
    $('ver').setAttribute('aria-label', ver ? 'Ocultar la contraseña' : 'Mostrar la contraseña');
    $('ver').title = $('ver').getAttribute('aria-label');
    $('pass').focus();
  };

  $('recordar').onclick = () => {
    const on = $('recordar').getAttribute('aria-pressed') !== 'true';
    $('recordar').setAttribute('aria-pressed', on);
  };

  function estado(texto) {
    $('entrar').textContent = texto;
  }
  function fallo(texto) {
    $('msg').textContent = texto;
    $('entrar').disabled = false;
    estado('Entrar');
    $('pass').select();
  }

  $('cerradura').onsubmit = async event => {
    event.preventDefault();
    const recordar = $('recordar').getAttribute('aria-pressed') === 'true';
    // Quita espacios del principio y del final (al copiar y pegar suelen colarse).
    const pass = $('pass').value.trim();
    $('entrar').disabled = true;
    $('msg').textContent = '';
    estado('Comprobando…');
    // Deja que se pinte «Comprobando…» antes del cálculo.
    await new Promise(resolve => setTimeout(resolve, 30));
    let html, clave;
    try {
      clave = await derivar(pass, recordar);
      html = await descifrar(clave);
      if (recordar) {
        try { localStorage.setItem(CLAVE, base64(await crypto.subtle.exportKey('raw', clave))); } catch {}
      }
    } catch (error) {
      // AES-GCM falla con OperationError si la clave no es la buena.
      fallo(error && error.name === 'OperationError' ? 'Contraseña incorrecta.' : 'No se ha podido abrir: ' + error);
      return;
    }
    estado('Abriendo…');
    await new Promise(resolve => setTimeout(resolve, 30));
    try {
      await mostrar(html, clave);
    } catch (error) {
      fallo('No se ha podido abrir: ' + error);
    }
  };

  if (!window.crypto || !crypto.subtle) {
    $('msg').textContent = 'Este navegador no puede descifrar la página (hace falta https).';
    $('entrar').disabled = true;
    return;
  }
  conGuardada().then(ok => { if (!ok) $('pass').focus(); });
})();
</script>
</body>
</html>
