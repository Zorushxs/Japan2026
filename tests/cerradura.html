<!DOCTYPE html>
<!-- Prueba de la página cifrada (la lanza tests/cerradura.js): abre ../index.html y, según ?modo=:
     buena    → la contraseña buena abre la app (una sola, sin restos de la cerradura)
     mala     → una contraseña errónea no entra
     recordar → con «Recordar», al recargar se abre sola y bien
     invitado → la contraseña de invitado abre la app sin billetes, sin Drive y sin base de datos
     Envía el resultado a /resultado. -->
<html><head><meta charset="utf-8"></head><body>
<pre id="out">ESPERANDO</pre>
<iframe id="f" src="../index.html" style="width:390px;height:800px"></iframe>
<script>
const q = new URLSearchParams(location.search);
const modo = q.get('modo');
const out = document.getElementById('out');
const f = document.getElementById('f');
const d = () => f.contentDocument;
const wait = (cond, ms) => new Promise((ok, ko) => {
  const t0 = Date.now();
  (function loop() {
    let si = false;
    try { si = cond(); } catch {}
    if (si) ok(); else if (Date.now() - t0 > ms) ko(new Error('tiempo')); else setTimeout(loop, 100);
  })();
});
const cargado = () => new Promise(resolve => { f.onload = () => { f.onload = null; resolve(); }; });

// La app está bien si hay calendario, una sola cabecera y nada de la cerradura.
function appBien() {
  const tops = d().querySelectorAll('.top').length, cerradura = d().getElementById('cerradura');
  const dias = d().querySelectorAll('.cel.viaje').length;
  if (tops !== 1 || cerradura || !dias) throw new Error(`app rota: ${tops} cabeceras, cerradura=${!!cerradura}, ${dias} días`);
  return `${dias} días`;
}

async function entrar(pass, recordar) {
  d().getElementById('pass').value = pass;
  if (recordar) d().getElementById('recordar').click();
  d().getElementById('entrar').click();
}

(async () => {
  try {
    try { localStorage.removeItem('viaje:clave'); } catch {}
    await cargado();
    if (modo === 'mala') {
      await entrar('otra cosa');
      await wait(() => d().getElementById('msg').textContent, 20000);
      out.textContent = 'OK mala: ' + d().getElementById('msg').textContent;
    } else if (modo === 'recordar') {
      await entrar(q.get('pass'), true);
      await wait(() => d().querySelector('.mes'), 20000);
      appBien();
      const recarga = cargado();
      f.contentWindow.location.reload();
      await recarga;
      await wait(() => d().querySelector('.mes'), 20000);
      await new Promise(r => setTimeout(r, 1500));
      out.textContent = 'OK recordar: al recargar se abre sola, ' + appBien();
      try { localStorage.removeItem('viaje:clave'); } catch {}
    } else if (modo === 'invitado') {
      await entrar(q.get('pass'));
      await wait(() => d().querySelector('.mes'), 20000);
      await new Promise(r => setTimeout(r, 500));
      const tieneBilletes = !!d().querySelector('[data-nav="billetes"]');
      const texto = d().documentElement.innerHTML;
      const fuga = /drive\.google\.com|firebasedatabase|data:image\/png/.test(texto) || false
        ? null : Object.keys(f.contentWindow.eval('ARCHIVOS')).filter(k => k.startsWith('billetes/'));
      if (tieneBilletes) throw new Error('el invitado ve la pestaña de billetes');
      if (/drive\.google\.com|firebasedatabase/.test(texto)) throw new Error('el invitado tiene enlaces de Drive o de la base de datos');
      if (f.contentWindow.eval('Datos.V.billetes').length) throw new Error('el invitado tiene billetes en los datos');
      if (!Object.keys(f.contentWindow.eval('ARCHIVOS')).some(k => k.startsWith('mapas/'))) throw new Error('el invitado no tiene mapas');
      if (fuga && fuga.length) throw new Error('el invitado tiene archivos de billetes');
      f.contentWindow.location.hash = '#/billetes/pase-west';
      await new Promise(r => setTimeout(r, 400));
      if (d().querySelector('.billete-caja, .reparto')) throw new Error('el invitado puede abrir un billete');
      out.textContent = 'OK invitado: ' + appBien() + ', sin billetes ni Drive';
    } else {
      await entrar(q.get('pass'));
      await wait(() => d().querySelector('.mes'), 20000);
      await new Promise(r => setTimeout(r, 500));
      const arch = Object.keys(f.contentWindow.eval('ARCHIVOS'));
      if (!arch.some(k => k.startsWith('mapas/')) || !arch.some(k => k.startsWith('billetes/'))) throw new Error('faltan mapas o billetes');
      out.textContent = 'OK buena: ' + appBien() + ', con mapas y billetes';
    }
  } catch (e) { out.textContent = 'FALLO ' + modo + ': ' + e.message; }
  fetch('/resultado', { method: 'POST', body: out.textContent });
})();
</script></body></html>
