<!DOCTYPE html>
<!-- Capturas a 390 px: frames.html?p=<página>&h=<hash>&t=light|dark[&alto=px][&ancho=px][&modo=resumen|detalle] (sin t, el tema del sistema). -->
<html><head><meta charset="utf-8"><style>body{margin:0;background:#888}iframe{border:0;width:390px;height:1700px;display:block}</style></head>
<body><script>
const q = new URLSearchParams(location.search);
try { if (q.get('t')) localStorage.setItem('viaje:tema', q.get('t')); else localStorage.removeItem('viaje:tema'); } catch {}
try { if (q.get('modo')) localStorage.setItem('viaje:modo', q.get('modo')); } catch {}
const f = document.createElement('iframe');
f.src = (q.get('p') || '../app/index.html') + '#' + (q.get('h') || '/');
if (q.get('alto')) f.style.height = q.get('alto') + 'px';
if (q.get('ancho')) f.style.width = q.get('ancho') + 'px';
document.body.append(f);
</script></body></html>
